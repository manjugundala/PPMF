<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Monitoring icon">
  <title>Power Platform Monitoring</title>
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A3A8C"/><stop offset="1" stop-color="#002868"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- red stripe (Texas flag) -->
    <rect x="0" y="448" width="512" height="64" fill="#BF0D3E"/>
    <rect x="0" y="440" width="512" height="8" fill="#FFFFFF"/>
    <!-- subtle grid -->
    <g stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4">
      <line x1="64" y1="160" x2="448" y2="160"/><line x1="64" y1="260" x2="448" y2="260"/><line x1="64" y1="360" x2="448" y2="360"/>
    </g>
  </g>
  <!-- Texas star -->
  <polygon points="104.0,64.0 113.0,91.6 142.0,91.6 118.5,108.7 127.5,136.4 104.0,119.3 80.5,136.4 89.5,108.7 66.0,91.6 95.0,91.6" fill="#FFFFFF"/>
  <!-- pulse line -->
  <polyline points="56,272 160,272 196,196 244,356 292,140 332,272 456,272"
            fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- alert point -->
  <circle cx="292" cy="140" r="34" fill="#BF0D3E" stroke="#FFFFFF" stroke-width="12"/>
</svg>